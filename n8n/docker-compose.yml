services:
  postgres:
    image: postgres:16-alpine
    container_name: intendencia-n8n-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intendencia_aulas}
      POSTGRES_USER: ${POSTGRES_USER:-intendencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-password-db}
      TZ: ${TZ:-America/Lima}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intendencia} -d ${POSTGRES_DB:-intendencia_aulas}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: intendencia-n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-cambiar-esta-clave-larga-y-segura}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-cambiar-password}
      - GENERIC_TIMEZONE=${TZ:-America/Lima}
      - TZ=${TZ:-America/Lima}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./samples:/files/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data: